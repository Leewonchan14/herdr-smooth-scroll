[package]
name = "herdr-smooth-scroll"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Eased, line-by-line scrollback scrolling for Herdr panes (a tmux-smooth-scroll port)"
license = "MIT"
repository = "https://github.com/Leewonchan14/herdr-smooth-scroll"
authors = ["WonChan Lee"]

[[bin]]
name = "herdr-smooth-scroll"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = true
strip = true
